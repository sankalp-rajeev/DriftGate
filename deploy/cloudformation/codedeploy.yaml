AWSTemplateFormatVersion: "2010-09-09"
Description: >-
  DriftGate CodeDeploy stack (FR-17, FR-18, ADR-002). CodeDeploy application and EC2 deployment
  group (in-place, OneAtATime, LabRole as service role) behind the serving target group of the
  network stack, which the group refers to by name, plus the two serving instances launched from
  the network stack's launch template. Per session, created after the network stack. T-13 adds
  the GateScore rollback alarm (FR-19, FR-20), a log of CodeDeploy state changes and the
  CloudWatch dashboard (FR-29).

Parameters:
  NetworkStackName:
    Type: String
    Default: driftgate-net
    Description: Name of the per-session network stack (deploy/cloudformation/network.yaml)
  LabRoleArn:
    Type: String
    Description: ARN of the pre-created LabRole, used as the CodeDeploy service role
  ApplicationName:
    Type: String
    Default: driftgate
  DeploymentGroupName:
    Type: String
    Default: driftgate-serving
  BucketName:
    Type: String
    Description: driftgate-storage bucket (BucketName output); bundles, models, reference, verdicts
  ServingPort:
    Type: Number
    Default: 8080
    Description: llama-server port; must equal the network stack ServingPort
  ProjectTag:
    Type: String
    Default: driftgate

Resources:
  Application:
    Type: AWS::CodeDeploy::Application
    Properties:
      ApplicationName: !Ref ApplicationName
      ComputePlatform: Server

  DeploymentGroup:
    Type: AWS::CodeDeploy::DeploymentGroup
    Properties:
      ApplicationName: !Ref Application
      DeploymentGroupName: !Ref DeploymentGroupName
      ServiceRoleArn: !Ref LabRoleArn
      DeploymentConfigName: CodeDeployDefault.OneAtATime
      # Traffic control: each instance is deregistered from the target group before its hooks
      # run and registered again only after ValidateService passes (FR-17).
      DeploymentStyle:
        DeploymentType: IN_PLACE
        DeploymentOption: WITH_TRAFFIC_CONTROL
      LoadBalancerInfo:
        TargetGroupInfoList:
          - Name:
              Fn::ImportValue: !Sub "${NetworkStackName}-TargetGroupName"
      # Both tag groups must match (AND): the serving instances of this project.
      Ec2TagSet:
        Ec2TagSetList:
          - Ec2TagGroup:
              - Key: Role
                Value: serving
                Type: KEY_AND_VALUE
          - Ec2TagGroup:
              - Key: Project
                Value: !Ref ProjectTag
                Type: KEY_AND_VALUE
      # FR-19: roll back on a failed hook (ValidateService exits non-zero) and when the
      # GateScore alarm stops the deployment.
      AutoRollbackConfiguration:
        Enabled: true
        Events:
          - DEPLOYMENT_FAILURE
          - DEPLOYMENT_STOP_ON_ALARM
      AlarmConfiguration:
        Enabled: true
        IgnorePollAlarmFailure: false
        Alarms:
          - Name: !Ref GateScoreAlarm

  # FR-20 / PRD 6.8: GateScore (published by ValidateService in enforce mode) above 1 for one
  # datapoint stops the deployment and rolls it back.
  GateScoreAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub "${DeploymentGroupName}-gate-score"
      AlarmDescription: DriftGate gate score above 1 (a detector over its calibrated threshold)
      Namespace: DriftGate
      MetricName: GateScore
      Dimensions:
        - Name: DeploymentGroup
          Value: !Ref DeploymentGroupName
      Statistic: Maximum
      Period: 60
      EvaluationPeriods: 1
      DatapointsToAlarm: 1
      Threshold: 1
      ComparisonOperator: GreaterThanThreshold
      TreatMissingData: notBreaching

  # FR-29 deployment status: CodeDeploy state-change events into a log group the dashboard
  # queries. EventBridge writes to it under the log group resource policy below (no new role).
  DeploymentEventsLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub "/aws/events/${ApplicationName}-deployments"
      RetentionInDays: 7

  DeploymentEventsLogPolicy:
    Type: AWS::Logs::ResourcePolicy
    Properties:
      PolicyName: !Sub "${ApplicationName}-deployment-events"
      PolicyDocument: !Sub |
        {
          "Version": "2012-10-17",
          "Statement": [{
            "Effect": "Allow",
            "Principal": {"Service": ["events.amazonaws.com", "delivery.logs.amazonaws.com"]},
            "Action": ["logs:CreateLogStream", "logs:PutLogEvents"],
            "Resource": "${DeploymentEventsLogGroup.Arn}"
          }]
        }

  DeploymentEventsRule:
    Type: AWS::Events::Rule
    Properties:
      Description: CodeDeploy deployment and instance state changes for the dashboard
      EventPattern:
        source: [aws.codedeploy]
        detail-type:
          - CodeDeploy Deployment State-change Notification
          - CodeDeploy Instance State-change Notification
        detail:
          application: [!Ref ApplicationName]
      Targets:
        - Id: deployment-log
          Arn: !GetAtt DeploymentEventsLogGroup.Arn

  # FR-29: gate score, alarm state, ALB target health and deployment status. The body is
  # observability/cloudwatch-dashboard.json (kept identical by tests/test_fr29_dashboard.py).
  Dashboard:
    Type: AWS::CloudWatch::Dashboard
    Properties:
      DashboardName: !Ref ApplicationName
      DashboardBody: !Sub
        - |
            {
              "widgets": [
                {
                  "type": "metric", "x": 0, "y": 0, "width": 12, "height": 6,
                  "properties": {
                    "title": "Gate score (fail above 1; enforce mode only)",
                    "region": "${AWS::Region}",
                    "view": "timeSeries",
                    "stat": "Maximum",
                    "period": 60,
                    "metrics": [["DriftGate", "GateScore", "DeploymentGroup", "${DeploymentGroupName}"]],
                    "annotations": {"horizontal": [{"label": "rollback above 1", "value": 1}]},
                    "yAxis": {"left": {"min": 0}}
                  }
                },
                {
                  "type": "alarm", "x": 12, "y": 0, "width": 12, "height": 6,
                  "properties": {
                    "title": "Rollback alarm state",
                    "alarms": ["${GateScoreAlarmArn}"]
                  }
                },
                {
                  "type": "metric", "x": 0, "y": 6, "width": 12, "height": 6,
                  "properties": {
                    "title": "ALB target health (serving target group)",
                    "region": "${AWS::Region}",
                    "view": "timeSeries",
                    "period": 60,
                    "metrics": [
                      ["AWS/ApplicationELB", "HealthyHostCount", "TargetGroup", "${TargetGroupFullName}", "LoadBalancer", "${LoadBalancerFullName}", {"stat": "Minimum"}],
                      ["AWS/ApplicationELB", "UnHealthyHostCount", "TargetGroup", "${TargetGroupFullName}", "LoadBalancer", "${LoadBalancerFullName}", {"stat": "Maximum"}]
                    ],
                    "yAxis": {"left": {"min": 0}}
                  }
                },
                {
                  "type": "log", "x": 12, "y": 6, "width": 12, "height": 6,
                  "properties": {
                    "title": "Deployment status (CodeDeploy state changes)",
                    "region": "${AWS::Region}",
                    "view": "table",
                    "query": "SOURCE '${DeploymentEventsLogGroup}' | fields @timestamp, detail.deploymentId, detail.state, detail.instanceGroupId | sort @timestamp desc | limit 20"
                  }
                },
                {
                  "type": "metric", "x": 0, "y": 12, "width": 24, "height": 6,
                  "properties": {
                    "title": "Raw detector values (always published)",
                    "region": "${AWS::Region}",
                    "view": "timeSeries",
                    "stat": "Maximum",
                    "period": 60,
                    "metrics": [
                      ["DriftGate", "D3MeanAgreementShare", "DeploymentGroup", "${DeploymentGroupName}"],
                      ["DriftGate", "D3P95ApproxKL", "DeploymentGroup", "${DeploymentGroupName}"],
                      ["DriftGate", "D5DeltaAccuracy", "DeploymentGroup", "${DeploymentGroupName}"],
                      ["DriftGate", "D6TtftRatio", "DeploymentGroup", "${DeploymentGroupName}"],
                      ["DriftGate", "D6ItlRatio", "DeploymentGroup", "${DeploymentGroupName}"]
                    ]
                  }
                }
              ]
            }
        - DeploymentGroupName: !Ref DeploymentGroupName
          GateScoreAlarmArn: !GetAtt GateScoreAlarm.Arn
          DeploymentEventsLogGroup: !Ref DeploymentEventsLogGroup
          TargetGroupFullName: !Select
            - 5
            - !Split
              - ":"
              - Fn::ImportValue: !Sub "${NetworkStackName}-TargetGroupArn"
          LoadBalancerFullName: !Select
            - 1
            - !Split
              - "loadbalancer/"
              - Fn::ImportValue: !Sub "${NetworkStackName}-AlbArn"

  ServingInstanceA:
    Type: AWS::EC2::Instance
    Properties:
      LaunchTemplate:
        LaunchTemplateId:
          Fn::ImportValue: !Sub "${NetworkStackName}-ServingLaunchTemplateId"
        Version: "1"
      SubnetId: !Select
        - 0
        - !Split
          - ","
          - Fn::ImportValue: !Sub "${NetworkStackName}-InstanceSubnetIds"
      Tags:
        - Key: Name
          Value: driftgate-serving-a
      UserData:
        Fn::Base64: !Sub |
          #!/bin/bash
          # Serving instance setup (Amazon Linux 2023): CodeDeploy agent, build tools, uv and
          # the instance settings read by the deploy hooks. llama.cpp and the model are
          # installed by the AfterInstall hook so they follow the revision being deployed.
          set -euxo pipefail
          dnf install -y ruby wget git cmake gcc-c++ make
          cd /tmp
          wget -q https://aws-codedeploy-${AWS::Region}.s3.${AWS::Region}.amazonaws.com/latest/install
          chmod +x ./install
          ./install auto
          systemctl enable --now codedeploy-agent
          curl -LsSf https://astral.sh/uv/install.sh | env UV_INSTALL_DIR=/usr/local/bin sh
          mkdir -p /etc/driftgate
          cat > /etc/driftgate/deploy.env <<EOF
          DRIFTGATE_BUCKET=${BucketName}
          DRIFTGATE_SERVING_PORT=${ServingPort}
          EOF

  ServingInstanceB:
    Type: AWS::EC2::Instance
    Properties:
      LaunchTemplate:
        LaunchTemplateId:
          Fn::ImportValue: !Sub "${NetworkStackName}-ServingLaunchTemplateId"
        Version: "1"
      SubnetId: !Select
        - 1
        - !Split
          - ","
          - Fn::ImportValue: !Sub "${NetworkStackName}-InstanceSubnetIds"
      Tags:
        - Key: Name
          Value: driftgate-serving-b
      UserData:
        Fn::Base64: !Sub |
          #!/bin/bash
          # Same setup as ServingInstanceA.
          set -euxo pipefail
          dnf install -y ruby wget git cmake gcc-c++ make
          cd /tmp
          wget -q https://aws-codedeploy-${AWS::Region}.s3.${AWS::Region}.amazonaws.com/latest/install
          chmod +x ./install
          ./install auto
          systemctl enable --now codedeploy-agent
          curl -LsSf https://astral.sh/uv/install.sh | env UV_INSTALL_DIR=/usr/local/bin sh
          mkdir -p /etc/driftgate
          cat > /etc/driftgate/deploy.env <<EOF
          DRIFTGATE_BUCKET=${BucketName}
          DRIFTGATE_SERVING_PORT=${ServingPort}
          EOF

Outputs:
  ApplicationName:
    Value: !Ref Application
  DeploymentGroupName:
    Value: !Ref DeploymentGroup
  ServingInstanceIds:
    Value: !Join [",", [!Ref ServingInstanceA, !Ref ServingInstanceB]]
  GateScoreAlarmName:
    Value: !Ref GateScoreAlarm
  DashboardName:
    Value: !Ref Dashboard
