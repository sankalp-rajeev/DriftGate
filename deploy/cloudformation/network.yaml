AWSTemplateFormatVersion: "2010-09-09"
Description: >-
  DriftGate per-session network stack (FR-21, ADR-005, PRD 6.8). VPC with public
  and private subnets in two AZs, one NAT gateway (UseNat=true) or public
  instance subnets with ALB-only ingress (UseNat=false), an S3 gateway endpoint,
  an internet-facing HTTP-80 ALB with the serving target group, security groups
  (NFR-04, NFR-06) and IMDSv2-only launch templates on Amazon Linux 2023.
  Created by `make up` at the start of a Lab session and deleted by `make down`.
  The S3 bucket lives in the persistent driftgate-storage stack, not here.

Parameters:
  ProjectTag:
    Type: String
    Default: driftgate
    Description: Value of the Project cost-allocation tag on every taggable resource.
  VpcCidr:
    Type: String
    Default: 10.42.0.0/16
  PublicSubnetACidr:
    Type: String
    Default: 10.42.0.0/24
  PublicSubnetBCidr:
    Type: String
    Default: 10.42.1.0/24
  PrivateSubnetACidr:
    Type: String
    Default: 10.42.10.0/24
  PrivateSubnetBCidr:
    Type: String
    Default: 10.42.11.0/24
  UseNat:
    Type: String
    Default: "true"
    AllowedValues: ["true", "false"]
    Description: >-
      true puts instances in private subnets behind one NAT gateway. false is the
      PRD 14.4 fallback - no NAT; instances run in the public subnets with
      ALB-only ingress and a public IP for outbound traffic.
  TargetGroupName:
    Type: String
    Default: driftgate-serving
    Description: Serving target group name; CodeDeploy (T-12) refers to it by this name.
  HealthCheckPath:
    Type: String
    Default: /health
    Description: llama-server health endpoint (FR-01).
  LatestAmiId:
    Type: AWS::SSM::Parameter::Value<AWS::EC2::Image::Id>
    Default: /aws/service/ami-amazon-linux-latest/al2023-ami-kernel-6.1-x86_64
    Description: Amazon Linux 2023 AMI from the SSM public parameter (PRD 6.8).
  ServingPort:
    Type: Number
    Default: 8080
    MinValue: 1
    MaxValue: 65535
    Description: llama-server listen port on serving instances; only the ALB may reach it.
  InstanceProfileName:
    Type: String
    Default: LabInstanceProfile
    Description: Pre-created Lab instance profile (role creation is denied in the Lab).
  InstanceType:
    Type: String
    Default: t3.large
  RootVolumeSize:
    Type: Number
    Default: 20
    Description: Root EBS volume size in GiB (PRD Section 15 assumes 20 GB).

Conditions:
  UseNat: !Equals [!Ref UseNat, "true"]

Resources:
  # ---------------------------------------------------------------- VPC
  Vpc:
    Type: AWS::EC2::VPC
    Properties:
      CidrBlock: !Ref VpcCidr
      EnableDnsSupport: true
      EnableDnsHostnames: true
      Tags:
        - Key: Name
          Value: !Sub "${AWS::StackName}-vpc"
        - Key: Project
          Value: !Ref ProjectTag

  InternetGateway:
    Type: AWS::EC2::InternetGateway
    Properties:
      Tags:
        - Key: Name
          Value: !Sub "${AWS::StackName}-igw"
        - Key: Project
          Value: !Ref ProjectTag

  InternetGatewayAttachment:
    Type: AWS::EC2::VPCGatewayAttachment
    Properties:
      VpcId: !Ref Vpc
      InternetGatewayId: !Ref InternetGateway

  # ------------------------------------------------------------ Subnets
  PublicSubnetA:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref Vpc
      CidrBlock: !Ref PublicSubnetACidr
      AvailabilityZone: !Select [0, !GetAZs ""]
      MapPublicIpOnLaunch: !If [UseNat, false, true]
      Tags:
        - Key: Name
          Value: !Sub "${AWS::StackName}-public-a"
        - Key: Project
          Value: !Ref ProjectTag

  PublicSubnetB:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref Vpc
      CidrBlock: !Ref PublicSubnetBCidr
      AvailabilityZone: !Select [1, !GetAZs ""]
      MapPublicIpOnLaunch: !If [UseNat, false, true]
      Tags:
        - Key: Name
          Value: !Sub "${AWS::StackName}-public-b"
        - Key: Project
          Value: !Ref ProjectTag

  PrivateSubnetA:
    Type: AWS::EC2::Subnet
    Condition: UseNat
    Properties:
      VpcId: !Ref Vpc
      CidrBlock: !Ref PrivateSubnetACidr
      AvailabilityZone: !Select [0, !GetAZs ""]
      MapPublicIpOnLaunch: false
      Tags:
        - Key: Name
          Value: !Sub "${AWS::StackName}-private-a"
        - Key: Project
          Value: !Ref ProjectTag

  PrivateSubnetB:
    Type: AWS::EC2::Subnet
    Condition: UseNat
    Properties:
      VpcId: !Ref Vpc
      CidrBlock: !Ref PrivateSubnetBCidr
      AvailabilityZone: !Select [1, !GetAZs ""]
      MapPublicIpOnLaunch: false
      Tags:
        - Key: Name
          Value: !Sub "${AWS::StackName}-private-b"
        - Key: Project
          Value: !Ref ProjectTag

  # ------------------------------------------------------------ Routing
  PublicRouteTable:
    Type: AWS::EC2::RouteTable
    Properties:
      VpcId: !Ref Vpc
      Tags:
        - Key: Name
          Value: !Sub "${AWS::StackName}-public"
        - Key: Project
          Value: !Ref ProjectTag

  PublicDefaultRoute:
    Type: AWS::EC2::Route
    DependsOn: InternetGatewayAttachment
    Properties:
      RouteTableId: !Ref PublicRouteTable
      DestinationCidrBlock: 0.0.0.0/0
      GatewayId: !Ref InternetGateway

  PublicSubnetARouteTableAssociation:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      SubnetId: !Ref PublicSubnetA
      RouteTableId: !Ref PublicRouteTable

  PublicSubnetBRouteTableAssociation:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      SubnetId: !Ref PublicSubnetB
      RouteTableId: !Ref PublicRouteTable

  # One NAT gateway for both private subnets: cost over AZ redundancy (PRD Section 15).
  # Created only when UseNat is true.
  NatEip:
    Type: AWS::EC2::EIP
    Condition: UseNat
    DependsOn: InternetGatewayAttachment
    Properties:
      Domain: vpc
      Tags:
        - Key: Name
          Value: !Sub "${AWS::StackName}-nat-eip"
        - Key: Project
          Value: !Ref ProjectTag

  NatGateway:
    Type: AWS::EC2::NatGateway
    Condition: UseNat
    Properties:
      AllocationId: !GetAtt NatEip.AllocationId
      SubnetId: !Ref PublicSubnetA
      Tags:
        - Key: Name
          Value: !Sub "${AWS::StackName}-nat"
        - Key: Project
          Value: !Ref ProjectTag

  PrivateRouteTable:
    Type: AWS::EC2::RouteTable
    Condition: UseNat
    Properties:
      VpcId: !Ref Vpc
      Tags:
        - Key: Name
          Value: !Sub "${AWS::StackName}-private"
        - Key: Project
          Value: !Ref ProjectTag

  PrivateDefaultRoute:
    Type: AWS::EC2::Route
    Condition: UseNat
    Properties:
      RouteTableId: !Ref PrivateRouteTable
      DestinationCidrBlock: 0.0.0.0/0
      NatGatewayId: !Ref NatGateway

  PrivateSubnetARouteTableAssociation:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Condition: UseNat
    Properties:
      SubnetId: !Ref PrivateSubnetA
      RouteTableId: !Ref PrivateRouteTable

  PrivateSubnetBRouteTableAssociation:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Condition: UseNat
    Properties:
      SubnetId: !Ref PrivateSubnetB
      RouteTableId: !Ref PrivateRouteTable

  # S3 gateway endpoint (no hourly charge): model, bundle and logits traffic skips the NAT.
  S3GatewayEndpoint:
    Type: AWS::EC2::VPCEndpoint
    Properties:
      VpcId: !Ref Vpc
      ServiceName: !Sub "com.amazonaws.${AWS::Region}.s3"
      VpcEndpointType: Gateway
      RouteTableIds: !If
        - UseNat
        - [!Ref PrivateRouteTable, !Ref PublicRouteTable]
        - [!Ref PublicRouteTable]

  # ----------------------------------------------------- Security groups
  AlbSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: DriftGate ALB - HTTP 80 from the internet only (no domain or certificate in the Lab)
      VpcId: !Ref Vpc
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 80
          ToPort: 80
          CidrIp: 0.0.0.0/0
          Description: HTTP
      Tags:
        - Key: Name
          Value: !Sub "${AWS::StackName}-alb"
        - Key: Project
          Value: !Ref ProjectTag

  ServingSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: DriftGate serving instances - llama-server port from the ALB only, no SSH
      VpcId: !Ref Vpc
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: !Ref ServingPort
          ToPort: !Ref ServingPort
          SourceSecurityGroupId: !Ref AlbSecurityGroup
          Description: llama-server from ALB
      Tags:
        - Key: Name
          Value: !Sub "${AWS::StackName}-serving"
        - Key: Project
          Value: !Ref ProjectTag

  BuildHostSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: DriftGate build host - no inbound, driven by SSM Run Command
      VpcId: !Ref Vpc
      SecurityGroupIngress: []
      Tags:
        - Key: Name
          Value: !Sub "${AWS::StackName}-build-host"
        - Key: Project
          Value: !Ref ProjectTag

  # ---------------------------------------------------------------- ALB
  # The network stack owns the ALB and the serving target group (PRD 6.8). CodeDeploy
  # (T-12) refers to the target group by name (output TargetGroupName) and registers
  # and deregisters instances during deploys. HTTP 80 only: no domain or certificate.
  Alb:
    Type: AWS::ElasticLoadBalancingV2::LoadBalancer
    Properties:
      Type: application
      Scheme: internet-facing
      Subnets:
        - !Ref PublicSubnetA
        - !Ref PublicSubnetB
      SecurityGroups:
        - !Ref AlbSecurityGroup
      LoadBalancerAttributes:
        - Key: routing.http.drop_invalid_header_fields.enabled
          Value: "true"
      Tags:
        - Key: Name
          Value: !Sub "${AWS::StackName}-alb"
        - Key: Project
          Value: !Ref ProjectTag

  AlbHttpListener:
    Type: AWS::ElasticLoadBalancingV2::Listener
    Properties:
      LoadBalancerArn: !Ref Alb
      Port: 80
      Protocol: HTTP
      DefaultActions:
        - Type: forward
          TargetGroupArn: !Ref ServingTargetGroup

  ServingTargetGroup:
    Type: AWS::ElasticLoadBalancingV2::TargetGroup
    Properties:
      Name: !Ref TargetGroupName
      VpcId: !Ref Vpc
      TargetType: instance
      Protocol: HTTP
      Port: !Ref ServingPort
      HealthCheckEnabled: true
      HealthCheckProtocol: HTTP
      HealthCheckPath: !Ref HealthCheckPath
      Matcher:
        HttpCode: "200"
      TargetGroupAttributes:
        # PRD 6.8: 30 s, so a OneAtATime deploy over two instances stays inside NFR-01.
        - Key: deregistration_delay.timeout_seconds
          Value: "30"
      Tags:
        - Key: Name
          Value: !Ref TargetGroupName
        - Key: Project
          Value: !Ref ProjectTag

  # ---------------------------------------------------- Launch templates
  # IMDSv2 required, no key pair, LabInstanceProfile, encrypted root volume.
  # Amazon Linux 2023 AMI (PRD 6.8). User data is left to the tasks that launch
  # instances (T-12, T-28). With UseNat=false the instances go in the public subnets,
  # which then assign public IPs; inbound is still ALB-only (serving) or none (build host).
  ServingLaunchTemplate:
    Type: AWS::EC2::LaunchTemplate
    Properties:
      LaunchTemplateName: !Sub "${AWS::StackName}-serving"
      LaunchTemplateData:
        ImageId: !Ref LatestAmiId
        InstanceType: !Ref InstanceType
        IamInstanceProfile:
          Name: !Ref InstanceProfileName
        SecurityGroupIds:
          - !Ref ServingSecurityGroup
        MetadataOptions:
          HttpTokens: required
          HttpEndpoint: enabled
          HttpPutResponseHopLimit: 1
        BlockDeviceMappings:
          - DeviceName: /dev/xvda
            Ebs:
              VolumeType: gp3
              VolumeSize: !Ref RootVolumeSize
              Encrypted: true
              DeleteOnTermination: true
        TagSpecifications:
          - ResourceType: instance
            Tags:
              - Key: Project
                Value: !Ref ProjectTag
              - Key: Role
                Value: serving
          - ResourceType: volume
            Tags:
              - Key: Project
                Value: !Ref ProjectTag

  BuildHostLaunchTemplate:
    Type: AWS::EC2::LaunchTemplate
    Properties:
      LaunchTemplateName: !Sub "${AWS::StackName}-build-host"
      LaunchTemplateData:
        ImageId: !Ref LatestAmiId
        InstanceType: !Ref InstanceType
        IamInstanceProfile:
          Name: !Ref InstanceProfileName
        SecurityGroupIds:
          - !Ref BuildHostSecurityGroup
        MetadataOptions:
          HttpTokens: required
          HttpEndpoint: enabled
          HttpPutResponseHopLimit: 1
        BlockDeviceMappings:
          - DeviceName: /dev/xvda
            Ebs:
              VolumeType: gp3
              VolumeSize: !Ref RootVolumeSize
              Encrypted: true
              DeleteOnTermination: true
        TagSpecifications:
          - ResourceType: instance
            Tags:
              - Key: Project
                Value: !Ref ProjectTag
              - Key: Role
                Value: build-host
          - ResourceType: volume
            Tags:
              - Key: Project
                Value: !Ref ProjectTag

Outputs:
  VpcId:
    Value: !Ref Vpc
    Export:
      Name: !Sub "${AWS::StackName}-VpcId"
  PublicSubnetIds:
    Value: !Join [",", [!Ref PublicSubnetA, !Ref PublicSubnetB]]
    Export:
      Name: !Sub "${AWS::StackName}-PublicSubnetIds"
  PrivateSubnetIds:
    Condition: UseNat
    Value: !Join [",", [!Ref PrivateSubnetA, !Ref PrivateSubnetB]]
    Export:
      Name: !Sub "${AWS::StackName}-PrivateSubnetIds"
  InstanceSubnetIds:
    Description: Subnets for serving instances and the build host (private with NAT, else public)
    Value: !If
      - UseNat
      - !Join [",", [!Ref PrivateSubnetA, !Ref PrivateSubnetB]]
      - !Join [",", [!Ref PublicSubnetA, !Ref PublicSubnetB]]
    Export:
      Name: !Sub "${AWS::StackName}-InstanceSubnetIds"
  AlbArn:
    Value: !Ref Alb
    Export:
      Name: !Sub "${AWS::StackName}-AlbArn"
  AlbDnsName:
    Description: Live URL host for the demo (FR-01, Section 9.1)
    Value: !GetAtt Alb.DNSName
    Export:
      Name: !Sub "${AWS::StackName}-AlbDnsName"
  AlbListenerArn:
    Value: !Ref AlbHttpListener
    Export:
      Name: !Sub "${AWS::StackName}-AlbListenerArn"
  TargetGroupName:
    Description: Serving target group name for the CodeDeploy deployment group (T-12)
    Value: !GetAtt ServingTargetGroup.TargetGroupName
    Export:
      Name: !Sub "${AWS::StackName}-TargetGroupName"
  TargetGroupArn:
    Value: !Ref ServingTargetGroup
    Export:
      Name: !Sub "${AWS::StackName}-TargetGroupArn"
  AlbSecurityGroupId:
    Value: !Ref AlbSecurityGroup
    Export:
      Name: !Sub "${AWS::StackName}-AlbSecurityGroupId"
  ServingSecurityGroupId:
    Value: !Ref ServingSecurityGroup
    Export:
      Name: !Sub "${AWS::StackName}-ServingSecurityGroupId"
  BuildHostSecurityGroupId:
    Value: !Ref BuildHostSecurityGroup
    Export:
      Name: !Sub "${AWS::StackName}-BuildHostSecurityGroupId"
  ServingLaunchTemplateId:
    Value: !Ref ServingLaunchTemplate
    Export:
      Name: !Sub "${AWS::StackName}-ServingLaunchTemplateId"
  BuildHostLaunchTemplateId:
    Value: !Ref BuildHostLaunchTemplate
    Export:
      Name: !Sub "${AWS::StackName}-BuildHostLaunchTemplateId"
