# Fault definitions (PRD Section 6.3). Each is a diff to the reference serving bundle:
#   set:       config values to change (dotted keys into serving/config.yaml)
#   template:  exact text edits to the served chat template (each `find` must occur once)
# `python -m faults.inject <id>` (or `make fault F=<id>`) builds the bundle and logs the diff.
faults:
  AA:
    layer: none
    description: Identical redeploy
  F1:
    layer: artifact
    description: Weights Q8_0 to Q4_K_M
    set:
      model: qwen2.5-1.5b-instruct-q4_k_m.gguf
  F2:
    layer: artifact
    description: Weights Q8_0 to Q2_K
    set:
      model: qwen2.5-1.5b-instruct-q2_k.gguf
  F3:
    layer: serving
    description: KV cache quantized at launch (PRD Section 6.2.1 flags)
    set:
      cache.type_k: q4_0
      cache.type_v: q4_0
      cache.flash_attn: "on"
  F4:
    layer: serving
    description: Chat template edit, system turn (default system prompt shortened)
    template:
      - find: "system\\nYou are Qwen, created by Alibaba Cloud. You are a helpful assistant.<|im_end|>"
        replace: "system\\nYou are a helpful assistant.<|im_end|>"
  # F5, F6, F7 and F9 as pre-registered (PRD Section 6.8). F8 is built by the study runner:
  # the latest llama.cpp release tag, recorded in the run log, as a diff to the llama_cpp_lock file.
  F5:
    layer: serving
    description: >-
      Tool-call branch of the template (tools only): the sentence that tells the model to return
      function calls inside <tool_call></tool_call> tags is deleted; every other branch is unchanged
    template:
      - find: "For each function call, return a json object with function name and arguments within <tool_call></tool_call> XML tags:\\n"
        replace: ""
  F6:
    layer: serving
    description: Default sampler temperature raised by 0.5 (the gate sends greedy requests; null result pre-registered)
    set:
      sampler.temperature: 1.3
  F7:
    layer: serving
    description: Context window cut from 4096 to 256, below panel prompt length
    set:
      context.ctx_size: 256
  F9:
    layer: engine
    description: Serving threads -1 (auto) to 1 (RQ3 control)
    set:
      threads: 1
  # RQ2 quantization sweep, analysis only (PRD Section 6.8): Q8_0 is AA, Q4_K_M is F1, Q2_K is F2.
  S-Q6_K:
    layer: artifact
    description: Sweep point, weights Q8_0 to Q6_K
    set:
      model: qwen2.5-1.5b-instruct-q6_k.gguf
  S-Q5_K_M:
    layer: artifact
    description: Sweep point, weights Q8_0 to Q5_K_M
    set:
      model: qwen2.5-1.5b-instruct-q5_k_m.gguf
  S-Q3_K_M:
    layer: artifact
    description: Sweep point, weights Q8_0 to Q3_K_M
    set:
      model: qwen2.5-1.5b-instruct-q3_k_m.gguf
