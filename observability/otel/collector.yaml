# FR-24: local OpenTelemetry collector. Receives OTLP traces and metrics from the gate.
# Traces go to Jaeger (trace viewer, PRD 6.8) and to runs/otel/traces.jsonl; metrics are
# exposed to Prometheus on :8889.
receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317
      http:
        endpoint: 0.0.0.0:4318

processors:
  batch: {}

exporters:
  debug:
    verbosity: basic
  otlp_grpc/jaeger:
    endpoint: jaeger:4317
    tls:
      insecure: true
  file:
    path: /out/traces.jsonl
  prometheus:
    endpoint: 0.0.0.0:8889

service:
  pipelines:
    traces:
      receivers: [otlp]
      processors: [batch]
      exporters: [otlp_grpc/jaeger, file, debug]
    metrics:
      receivers: [otlp]
      processors: [batch]
      exporters: [prometheus]
