# Local observability stack for the research layer (FR-22 to FR-24, ADR-009, PRD 6.8).
# llama-server (port 8082 locally) and the gate run on the host from the pinned local
# llama.cpp build; containers reach them via host.docker.internal.
#   make obs-up      # docker compose -f observability/docker-compose.yml up -d
#   make obs-down
name: driftgate-observability

services:
  prometheus:
    image: prom/prometheus:v3.16.0
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --web.enable-lifecycle
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
    ports:
      - "${PROMETHEUS_PORT:-9090}:9090"
    extra_hosts:
      - host.docker.internal:host-gateway

  grafana:
    image: grafana/grafana:13.2.6
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
    ports:
      - "${GRAFANA_PORT:-3000}:3000"
    depends_on:
      - prometheus

  jaeger:
    # Jaeger v2 runs as all-in-one by default (in-memory storage); the v1
    # jaegertracing/all-in-one image is end of life. UI on 16686.
    image: jaegertracing/jaeger:2.22.0
    ports:
      - "${JAEGER_UI_PORT:-16686}:16686"

  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.164.0
    command: ["--config=/etc/otelcol/config.yaml"]
    user: "${DOCKER_UID:-1000}:${DOCKER_GID:-1000}"  # write runs/otel as the host user
    volumes:
      - ./otel/collector.yaml:/etc/otelcol/config.yaml:ro
      - ../runs/otel:/out
    ports:
      - "${OTLP_GRPC_PORT:-4317}:4317"
      - "${OTLP_HTTP_PORT:-4318}:4318"
    depends_on:
      - jaeger
