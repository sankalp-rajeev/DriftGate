# Gate config (PRD Section 6.8). Read by `python -m gate`.
schema_version: 1
# report: record verdicts, exit 0. enforce: exit 1 when a rule in `thresholds` fails.
# auto: enforce once `thresholds` exists (written by A/A calibration, T-15), report until then.
mode: auto
thresholds: gate/thresholds.json
# Reference measurement (`python -m gate measure` on the reference serving config, budget 256).
reference: artifacts/reference/measurement.json
data:
  d3_prompts: gate/data/d3_prompts.jsonl
  d5_panel: gate/data/d5_panel.jsonl            # frozen by T-30 (PRD Section 6.2.1)
# D2 (FR-05, PRD Section 6.2.1): llama-perplexity KL divergence against stored reference logits.
d2:
  corpus: gate/data/d2_corpus.txt
  ctx_size: 512
  base_logits: artifacts/reference/d2_base.kld   # never in git; S3 for the build host
